name: Live SVG Engine

# يعيد بناء أصول البيانات الحية (stats / heatmap / projects / languages)
# بنسختي الثيم الداكن والفاتح — من واجهة GitHub، كل 6 ساعات وعند كل دفع.

on:
  schedule:
    - cron: "20 */6 * * *"   # مزاح 20 دقيقة عن أفعى المساهمات (0 */6)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: live-svg
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate live-data SVGs (dark + light)
        run: node scripts/generate-live-svg.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: ${{ github.repository_owner }}

      - name: Commit live-data SVGs (race-safe)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin main
          git add assets/stats-live-*.svg assets/heatmap-live-*.svg assets/projects-live-*.svg assets/languages-live-*.svg
          if git diff --cached --quiet; then echo "no live-data changes"; exit 0; fi
          git commit -m "chore: sync live data svgs [skip ci]"
          if ! git push; then
            echo "push raced — rebasing and retrying"
            git pull --rebase origin main
            git push
          fi
