name: Contribution Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-dark.svg?color_snake=#FF4D5E&color_dots=#1B1E24,#3A2228,#6E2A32,#B03740,#FF4D5E
            assets/snake-light.svg?color_snake=#C92230&color_dots=#F0F1F3,#F8D8DC,#F0ABB3,#E15564,#C92230

      - name: Commit regenerated snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate contribution snake [skip ci]"
          file_pattern: "assets/snake-*.svg"
