name: Contribution Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-dark.svg?color_snake=#E2A93B&color_dots=#161D29,#232A38,#2A3242,#8A6420,#E2A93B
            assets/snake-light.svg?color_snake=#B87D1F&color_dots=#EDF0F4,#C9D2DE,#8A93A3,#C9922B,#B87D1F

      - name: Commit regenerated snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate contribution snake [skip ci]"
          file_pattern: "assets/snake-*.svg"
