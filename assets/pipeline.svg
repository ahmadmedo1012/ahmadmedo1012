<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img">
  <title>خط الإنتاج — أربعة مسارات تعمل الآن: التعليم، التجارة، الأتمتة، الاستخبارات المفتوحة</title>
  <rect width="1200" height="280" fill="#0D1017"/>

  <!-- الترويسة -->
  <text x="1176" y="36" text-anchor="end" font-family="Segoe UI, Tahoma, Noto Sans Arabic, Geeza Pro, sans-serif" font-size="19" font-weight="700" fill="#F2EFE6">خط الإنتاج — أربعة مسارات تعمل الآن</text>
  <circle cx="28" cy="32" r="4" fill="#E2A93B">
    <animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <text x="42" y="36" font-family="Cascadia Code, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#7E8798">4 TRACKS · ALL SHIPPING · MADE IN LIBYA</text>

  <!-- ===== العقد الأربع ===== -->

  <!-- 1) التعليم -->
  <g opacity="1">
    <animate attributeName="opacity" values="0;1" begin="0.05s" dur="0.5s" fill="freeze"/>
    <circle cx="180" cy="134" r="24" fill="none" stroke="#E2A93B" stroke-width="1.2" opacity="0">
      <animate attributeName="r" values="22;34" dur="2.6s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="2.6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <rect x="55" y="88" width="250" height="140" rx="14" fill="#11151E" stroke="#2A3242"/>
    <g transform="translate(180 130)" fill="none" stroke="#E2A93B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-11 -5 L0 -10 L11 -5 L0 0 Z"/>
      <path d="M-11 -5 v6 c0 2.8 4.9 5 11 5 s11 -2.2 11 -5 v-6"/>
      <path d="M0 0 v6"/>
      <circle cx="0" cy="8.5" r="1.5" fill="#E2A93B" stroke="none"/>
    </g>
    <text x="180" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, Noto Sans Arabic, Geeza Pro, sans-serif" font-size="17" font-weight="700" fill="#F2EFE6">التعليم</text>
    <text x="180" y="202" text-anchor="middle" font-family="Cascadia Code, SF Mono, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.5" fill="#7E8798">EDUCATION OS</text>
    <text x="180" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, Noto Sans Arabic, Geeza Pro, sans-serif" font-size="11" fill="#7E8798">أُلارا · مدارك</text>
  </g>

  <!-- وصلة 1→2 -->
  <g>
    <line x1="307" y1="158" x2="333" y2="158" stroke="#2A3242" stroke-width="1.5" stroke-dasharray="4 5">
      <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.1s" repeatCount="indefinite"/>
    </line>
    <circle r="3" fill="#E2A93B">
      <animateMotion path="M307 158 L333 158" dur="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 2) التجارة -->
  <g opacity="1">
    <animate attributeName="opacity" values="0;1" begin="0.2s" dur="0.5s" fill="freeze"/>
    <circle cx="460" cy="134" r="24" fill="none" stroke="#E2A93B" stroke-width="1.2" opacity="0">
      <animate attributeName="r" values="22;34" dur="2.6s" begin="0.65s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="2.6s" begin="0.65s" repeatCount="indefinite"/>
    </circle>
    <rect x="335" y="88" width="250" height="140" rx="14" fill="#11151E" stroke="#2A3242"/>
    <g transform="translate(460 130)" fill="none" stroke="#E2A93B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-9 -3 h18 l-1.6 13 h-14.8 z"/>
      <path d="M-4.5 -3 a4.5 5.5 0 0 1 9 0"/>
      <path d="M-5.5 3.5 h11" stroke-width="1.2"/>
    </g>
    <text x="460" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, Noto Sans Arabic, Geeza Pro, sans-serif" font-size="17" font-weight="700" fill="#F2EFE6">التجارة</text>
    <text x="460" y="202" text-anchor="middle" font-family="Cascadia Code, SF Mono, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.5" fill="#7E8798">COMMERCE SAAS</text>
    <text x="460" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, Noto Sans Arabic, Geeza Pro, sans-serif" font-size="11" fill="#7E8798">سب نيشن · منيو · أوردر · لينك</text>
  </g>

  <!-- وصلة 2→3 -->
  <g>
    <line x1="587" y1="158" x2="613" y2="158" stroke="#2A3242" stroke-width="1.5" stroke-dasharray="4 5">
      <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.1s" begin="0.2s" repeatCount="indefinite"/>
    </line>
    <circle r="3" fill="#E2A93B">
      <animateMotion path="M587 158 L613 158" dur="1.6s" begin="0.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 3) الأتمتة -->
  <g opacity="1">
    <animate attributeName="opacity" values="0;1" begin="0.35s" dur="0.5s" fill="freeze"/>
    <circle cx="740" cy="134" r="24" fill="none" stroke="#E2A93B" stroke-width="1.2" opacity="0">
      <animate attributeName="r" values="22;34" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="2.6s" begin="1.3s" repeatCount="indefinite"/>
    </circle>
    <rect x="615" y="88" width="250" height="140" rx="14" fill="#11151E" stroke="#2A3242"/>
    <g transform="translate(740 130)">
      <g fill="none" stroke="#E2A93B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="-9" y="-6" width="18" height="13" rx="3.5"/>
        <path d="M0 -6 v-4"/>
        <path d="M-3.5 4.5 h7"/>
      </g>
      <circle cx="0" cy="-11.5" r="1.7" fill="#E2A93B"/>
      <circle cx="-3.6" cy="-0.5" r="1.5" fill="#E2A93B">
        <animate attributeName="opacity" values="1;.3;1" dur="2.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="3.6" cy="-0.5" r="1.5" fill="#E2A93B">
        <animate attributeName="opacity" values="1;.3;1" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="740" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, Noto Sans Arabic, Geeza Pro, sans-serif" font-size="17" font-weight="700" fill="#F2EFE6">الأتمتة</text>
    <text x="740" y="202" text-anchor="middle" font-family="Cascadia Code, SF Mono, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.5" fill="#7E8798">BOTS &amp; AUTOMATION</text>
    <text x="740" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, Noto Sans Arabic, Geeza Pro, sans-serif" font-size="11" fill="#7E8798">سمارت بوت · openwa</text>
  </g>

  <!-- وصلة 3→4 -->
  <g>
    <line x1="867" y1="158" x2="893" y2="158" stroke="#2A3242" stroke-width="1.5" stroke-dasharray="4 5">
      <animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.1s" begin="0.4s" repeatCount="indefinite"/>
    </line>
    <circle r="3" fill="#E2A93B">
      <animateMotion path="M867 158 L893 158" dur="1.6s" begin="0.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 4) الاستخبارات المفتوحة -->
  <g opacity="1">
    <animate attributeName="opacity" values="0;1" begin="0.5s" dur="0.5s" fill="freeze"/>
    <circle cx="1020" cy="134" r="24" fill="none" stroke="#E2A93B" stroke-width="1.2" opacity="0">
      <animate attributeName="r" values="22;34" dur="2.6s" begin="1.95s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="2.6s" begin="1.95s" repeatCount="indefinite"/>
    </circle>
    <rect x="895" y="88" width="250" height="140" rx="14" fill="#11151E" stroke="#2A3242"/>
    <g transform="translate(1020 128)" fill="none" stroke="#E2A93B" stroke-width="1.8" stroke-linecap="round">
      <circle cx="-1.5" cy="-1.5" r="7.5"/>
      <ellipse cx="-1.5" cy="-1.5" rx="3.2" ry="7.5" stroke-width="1.2"/>
      <path d="M-9 -1.5 h15" stroke-width="1.2"/>
      <path d="M4.5 4.5 L10 10"/>
      <circle cx="-1.5" cy="-1.5" r="1.4" fill="#E2A93B" stroke="none">
        <animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>
    <text x="1020" y="182" text-anchor="middle" font-family="Segoe UI, Tahoma, Noto Sans Arabic, Geeza Pro, sans-serif" font-size="17" font-weight="700" fill="#F2EFE6">الاستخبارات المفتوحة</text>
    <text x="1020" y="202" text-anchor="middle" font-family="Cascadia Code, SF Mono, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.5" fill="#7E8798">OPEN-SOURCE INTEL</text>
    <text x="1020" y="220" text-anchor="middle" font-family="Segoe UI, Tahoma, Noto Sans Arabic, Geeza Pro, sans-serif" font-size="11" fill="#7E8798">ليوسينت</text>
  </g>

  <!-- قضيب الحالة السفلي -->
  <line x1="60" y1="256" x2="1140" y2="256" stroke="#161D29" stroke-width="1.5"/>
  <circle r="2.5" fill="#E2A93B">
    <animateMotion path="M60 256 L1140 256" dur="7s" repeatCount="indefinite"/>
  </circle>
  <text x="1140" y="272" text-anchor="end" font-family="Cascadia Code, SF Mono, Menlo, Consolas, monospace" font-size="9" fill="#7E8798">PIPELINE STATUS: ALL TRACKS LIVE</text>
</svg>
