<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img">
  <title>خاتمة — git push origin future</title>
  <rect width="1200" height="140" fill="#0D1017"/>

  <!-- قضيبان جانبيان بنقاط تتجه للمركز -->
  <line x1="60" y1="74" x2="430" y2="74" stroke="#161D29" stroke-width="1.5"/>
  <circle r="2.5" fill="#E2A93B">
    <animateMotion path="M60 74 L430 74" dur="3s" repeatCount="indefinite"/>
  </circle>
  <line x1="770" y1="74" x2="1140" y2="74" stroke="#161D29" stroke-width="1.5"/>
  <circle r="2.5" fill="#E2A93B">
    <animateMotion path="M1140 74 L770 74" dur="3s" begin="0.7s" repeatCount="indefinite"/>
  </circle>

  <!-- المعين المركزي ينبض -->
  <rect x="594" y="68" width="12" height="12" rx="2.5" transform="rotate(45 600 74)" fill="none" stroke="#E2A93B" stroke-width="1.5">
    <animate attributeName="opacity" values="1;.35;1" dur="2.4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="74" r="2.2" fill="#E2A93B">
    <animate attributeName="r" values="1.8;3;1.8" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- سطر الدفع مع مؤشر وامض -->
  <text x="600" y="44" text-anchor="middle" font-family="Cascadia Code, SF Mono, Menlo, Consolas, monospace" font-size="15" fill="#C7CEDB">$ git push origin future</text>
  <rect x="716" y="32" width="9" height="17" fill="#E2A93B">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.05s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="106" text-anchor="middle" font-family="Segoe UI, Tahoma, Noto Sans Arabic, Geeza Pro, sans-serif" font-size="13" fill="#F2EFE6">© 2025 — أحمد رضوان · صُنع بعناية في ليبيا</text>
  <text x="600" y="126" text-anchor="middle" font-family="Cascadia Code, SF Mono, Menlo, Consolas, monospace" font-size="9.5" letter-spacing="1.5" fill="#7E8798">BUILT WITH INTENT · LIVE DATA VIA GITHUB ACTIONS · EVERYTHING MOVES</text>
</svg>
