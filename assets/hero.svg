<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img">
  <title>أحمد رضوان — من رابط إلى منظومة</title>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#151B26" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="16" fill="#0D1017"/>
  <rect width="1200" height="380" rx="16" fill="url(#grid)"/>

  <!-- نجمة ثمانية (هندسة عربية) -->
  <g fill="none" stroke="#1A212E" stroke-width="1.5">
    <rect x="78" y="98" width="184" height="184" rx="10"/>
    <rect x="78" y="98" width="184" height="184" rx="10" transform="rotate(45 170 190)"/>
  </g>
  <g fill="none" stroke="#161D29" stroke-width="1.2">
    <rect x="1032" y="272" width="56" height="56" rx="5"/>
    <rect x="1032" y="272" width="56" height="56" rx="5" transform="rotate(45 1060 300)"/>
  </g>

  <!-- علامات الزوايا -->
  <g fill="none" stroke="#2A3242" stroke-width="2" stroke-linecap="round">
    <path d="M28 56V28H56"/>
    <path d="M1144 28H1172V56"/>
    <path d="M1172 324V352H1144"/>
    <path d="M56 352H28V324"/>
  </g>

  <!-- البذرة: الرابط الأول -->
  <g>
    <circle cx="1104" cy="122" r="5" fill="#E2A93B"/>
    <circle cx="1104" cy="122" r="11" fill="none" stroke="#E2A93B" stroke-opacity="0.35" stroke-width="1.5"/>
    <path d="M1088 122H1020" stroke="#2A3242" stroke-width="1.5" stroke-dasharray="3 5" fill="none"/>
    <circle cx="1008" cy="122" r="3" fill="#5C6577"/>
    <path d="M998 122H962" stroke="#232A38" stroke-width="1.5" stroke-dasharray="3 5" fill="none"/>
    <circle cx="952" cy="122" r="2.2" fill="#3A4356"/>
  </g>

  <!-- المتن -->
  <text x="600" y="106" text-anchor="middle" font-family="Segoe UI, Tahoma, Noto Sans Arabic, Geeza Pro, sans-serif" font-size="18" font-weight="600" fill="#E2A93B">من رابط إلى منظومة</text>
  <text x="600" y="130" text-anchor="middle" font-family="Cascadia Code, SF Mono, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" letter-spacing="4" fill="#8A93A3">FROM A LINK TO A SYSTEM</text>

  <text x="600" y="216" text-anchor="middle" font-family="Segoe UI, Tahoma, Noto Sans Arabic, Geeza Pro, sans-serif" font-size="76" font-weight="700" fill="#F2EFE6">أحمد رضوان</text>
  <rect x="570" y="240" width="60" height="3" rx="1.5" fill="#E2A93B"/>

  <text x="600" y="280" text-anchor="middle" font-family="Cascadia Code, SF Mono, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="19" letter-spacing="10" fill="#9AA3B5">AHMAD RADWAN</text>
  <text x="600" y="318" text-anchor="middle" font-family="Segoe UI, Tahoma, Noto Sans Arabic, Geeza Pro, sans-serif" font-size="20" fill="#C7CEDB">باني منتجات رقمية عربية-أولًا — منظومات تُبنى في ليبيا وتصل إلى الإنتاج</text>

  <!-- عقد المنظومة: ألوان المشاريع الثمانية -->
  <line x1="434" y1="352" x2="766" y2="352" stroke="#2A3242" stroke-width="1.5"/>
  <rect x="434" y="347" width="10" height="10" rx="2.5" fill="#8AA0FF"/>
  <rect x="480" y="347" width="10" height="10" rx="2.5" fill="#FA3600"/>
  <rect x="526" y="347" width="10" height="10" rx="2.5" fill="#56E2F2"/>
  <rect x="572" y="347" width="10" height="10" rx="2.5" fill="#E9B44C"/>
  <rect x="618" y="347" width="10" height="10" rx="2.5" fill="#FF7A38"/>
  <rect x="664" y="347" width="10" height="10" rx="2.5" fill="#FF4C00"/>
  <rect x="710" y="347" width="10" height="10" rx="2.5" fill="#34D399"/>
  <rect x="756" y="347" width="10" height="10" rx="2.5" fill="#A78BFA"/>
</svg>
