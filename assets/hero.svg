<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img">
  <title>أحمد رضوان — من رابط إلى منظومة · واجهة حية</title>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#151B26" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="380" rx="16" fill="#0D1017"/>
  <rect width="1200" height="380" rx="16" fill="url(#grid)"/>

  <!-- خط ماسح عمودي يعبر اللوحة -->
  <rect x="-90" y="0" width="90" height="380" fill="#E2A93B" opacity="0.045">
    <animateTransform attributeName="transform" type="translate" values="0 0;1290 0" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- النجمة الثمانية (هندسة عربية) — تدور ببطء -->
  <g fill="none" stroke="#1A212E" stroke-width="1.5">
    <rect x="78" y="98" width="184" height="184" rx="10"/>
    <rect x="78" y="98" width="184" height="184" rx="10" transform="rotate(45 170 190)">
      <animateTransform attributeName="transform" type="rotate" from="45 170 190" to="405 170 190" dur="80s" repeatCount="indefinite"/>
    </rect>
  </g>
  <!-- قلب النجمة ينبض -->
  <circle cx="170" cy="190" r="4" fill="#E2A93B">
    <animate attributeName="r" values="3.5;5;3.5" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="190" r="14" fill="none" stroke="#E2A93B" stroke-width="1">
    <animate attributeName="r" values="10;26" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;0" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="#161D29" stroke-width="1.2">
    <rect x="1032" y="272" width="56" height="56" rx="5"/>
    <rect x="1032" y="272" width="56" height="56" rx="5" transform="rotate(45 1060 300)">
      <animateTransform attributeName="transform" type="rotate" from="45 1060 300" to="-315 1060 300" dur="60s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- علامات الزوايا -->
  <g fill="none" stroke="#2A3242" stroke-width="2" stroke-linecap="round">
    <path d="M28 56V28H56"/>
    <path d="M1144 28H1172V56"/>
    <path d="M1172 324V352H1144"/>
    <path d="M56 352H28V324"/>
  </g>

  <!-- البذرة: الرابط الأول — ينبض والبيانات تتدفق إليه -->
  <g>
    <path d="M1088 122H1020" stroke="#2A3242" stroke-width="1.5" stroke-dasharray="3 5" fill="none">
      <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.4s" repeatCount="indefinite"/>
    </path>
    <path d="M998 122H962" stroke="#232A38" stroke-width="1.5" stroke-dasharray="3 5" fill="none">
      <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1.4s" begin="0.3s" repeatCount="indefinite"/>
    </path>
    <circle cx="1008" cy="122" r="3" fill="#5C6577"/>
    <circle cx="952" cy="122" r="2.2" fill="#3A4356"/>
    <circle cx="1104" cy="122" r="5" fill="#E2A93B">
      <animate attributeName="opacity" values="1;.55;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1104" cy="122" r="11" fill="none" stroke="#E2A93B" stroke-opacity="0.35" stroke-width="1.5">
      <animate attributeName="r" values="9;22" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.5;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1104" cy="122" r="11" fill="none" stroke="#E2A93B" stroke-opacity="0.35" stroke-width="1.5">
      <animate attributeName="r" values="9;22" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="stroke-opacity" values="0.5;0" dur="2.2s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- قراءات HUD يمين: حالة المنتجات -->
  <text x="1172" y="168" text-anchor="end" font-family="Cascadia Code, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#7E8798">$ systemctl status products</text>
  <circle cx="1014" cy="185" r="4" fill="#E2A93B">
    <animate attributeName="opacity" values="1;.25;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="1026" y="189" font-family="Cascadia Code, SF Mono, Menlo, Consolas, monospace" font-size="11" fill="#E2A93B">8/8 ACTIVE · UPTIME 1Y</text>

  <!-- المتن -->
  <text x="600" y="106" text-anchor="middle" font-family="Segoe UI, Tahoma, Noto Sans Arabic, Geeza Pro, sans-serif" font-size="18" font-weight="600" fill="#E2A93B">من رابط إلى منظومة</text>
  <text x="600" y="130" text-anchor="middle" font-family="Cascadia Code, SF Mono, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12" letter-spacing="4" fill="#8A93A3">FROM A LINK TO A SYSTEM</text>

  <!-- الاسم + وميض glitch خفيف -->
  <text x="602" y="214" text-anchor="middle" font-family="Segoe UI, Tahoma, Noto Sans Arabic, Geeza Pro, sans-serif" font-size="76" font-weight="700" fill="#E2A93B" opacity="0">أحمد رضوان
    <animate attributeName="opacity" values="0;0;0;0.45;0;0;0;0.25;0;0" keyTimes="0;0.52;0.54;0.555;0.57;0.59;0.78;0.79;0.80;1" dur="7s" repeatCount="indefinite"/>
  </text>
  <text x="598" y="212" text-anchor="middle" font-family="Segoe UI, Tahoma, Noto Sans Arabic, Geeza Pro, sans-serif" font-size="76" font-weight="700" fill="#F2EFE6" opacity="0">أحمد رضوان
    <animate attributeName="opacity" values="0;0;0;0.3;0;0;0;0;0" keyTimes="0;0.53;0.545;0.56;0.575;0.6;0.79;0.795;1" dur="7s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="216" text-anchor="middle" font-family="Segoe UI, Tahoma, Noto Sans Arabic, Geeza Pro, sans-serif" font-size="76" font-weight="700" fill="#F2EFE6">أحمد رضوان</text>
  <rect x="570" y="240" width="60" height="3" rx="1.5" fill="#E2A93B">
    <animate attributeName="width" values="0;60" begin="0.4s" dur="0.8s" calcMode="spline" keySplines="0.22 0.9 0.28 1" keyTimes="0;1" fill="freeze"/>
  </rect>

  <text x="600" y="280" text-anchor="middle" font-family="Cascadia Code, SF Mono, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="19" letter-spacing="10" fill="#9AA3B5">AHMAD RADWAN</text>
  <text x="600" y="318" text-anchor="middle" font-family="Segoe UI, Tahoma, Noto Sans Arabic, Geeza Pro, sans-serif" font-size="20" fill="#C7CEDB">باني منتجات رقمية عربية-أولًا — منظومات تُبنى في ليبيا وتصل إلى الإنتاج</text>

  <!-- عقد المنظومة: ألوان المشاريع الثمانية تتنفس -->
  <line x1="434" y1="352" x2="766" y2="352" stroke="#2A3242" stroke-width="1.5"/>
  <rect x="434" y="347" width="10" height="10" rx="2.5" fill="#8AA0FF"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" begin="0s" repeatCount="indefinite"/></rect>
  <rect x="480" y="347" width="10" height="10" rx="2.5" fill="#FA3600"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" begin="0.3s" repeatCount="indefinite"/></rect>
  <rect x="526" y="347" width="10" height="10" rx="2.5" fill="#56E2F2"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></rect>
  <rect x="572" y="347" width="10" height="10" rx="2.5" fill="#E9B44C"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" begin="0.9s" repeatCount="indefinite"/></rect>
  <rect x="618" y="347" width="10" height="10" rx="2.5" fill="#FF7A38"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></rect>
  <rect x="664" y="347" width="10" height="10" rx="2.5" fill="#FF4C00"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" begin="1.5s" repeatCount="indefinite"/></rect>
  <rect x="710" y="347" width="10" height="10" rx="2.5" fill="#34D399"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" begin="1.8s" repeatCount="indefinite"/></rect>
  <rect x="756" y="347" width="10" height="10" rx="2.5" fill="#A78BFA"><animate attributeName="opacity" values="1;.3;1" dur="2.4s" begin="2.1s" repeatCount="indefinite"/></rect>
</svg>
