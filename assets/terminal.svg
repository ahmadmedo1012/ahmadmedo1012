<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" font-family="Cascadia Code, SF Mono, Consolas, Menlo, monospace">
  <title>الطرفية الحية — أحمد رضوان</title>
  <defs>
    <pattern id="tgrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#151B26" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- نافذة الطرفية -->
  <rect x="1.5" y="1.5" width="1197" height="467" rx="16" fill="#0D1017" stroke="#2A3242" stroke-width="1.5"/>

  <!-- شريط العنوان -->
  <path d="M2.25 48 V18 A15.75 15.75 0 0 1 18 2.25 H1182 A15.75 15.75 0 0 1 1197.75 18 V48 Z" fill="#12161F"/>
  <line x1="2.25" y1="48" x2="1197.75" y2="48" stroke="#232A38" stroke-width="1.5"/>
  <circle cx="30" cy="25" r="5.5" fill="#E2A93B"/>
  <circle cx="52" cy="25" r="5.5" fill="none" stroke="#2A3242" stroke-width="1.5"/>
  <circle cx="74" cy="25" r="5.5" fill="none" stroke="#2A3242" stroke-width="1.5"/>
  <text x="600" y="30.5" text-anchor="middle" font-size="15" letter-spacing="0.5" fill="#9AA3B5">ahmad@libya — ~/build — zsh</text>

  <!-- شبكة خفيفة -->
  <rect x="3" y="49" width="1194" height="388" fill="url(#tgrid)"/>

  <!-- الأسطر: مرئية افتراضيًا؛ الحركة تكشفها تباعًا فلا تبقى فارغة أبدًا -->
  <g>
    <text x="56" y="94" font-size="19"><tspan fill="#E2A93B">$</tspan><tspan fill="#F2EFE6" dx="10">whoami</tspan></text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.06;0.07;1" dur="2.5s" fill="freeze"/>
  </g>
  <g>
    <text x="56" y="132" font-size="19" fill="#C7CEDB">ahmed-radwan · digital product builder · libya</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.16;0.17;1" dur="2.5s" fill="freeze"/>
  </g>
  <g>
    <text x="56" y="170" font-size="19"><tspan fill="#E2A93B">$</tspan><tspan fill="#F2EFE6" dx="10">ls ./products</tspan></text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.28;0.29;1" dur="2.5s" fill="freeze"/>
  </g>
  <g>
    <text x="56" y="208" font-size="19" fill="#E2A93B">ulara  madarek  subnation  smartbot  smart-menu  smart-order  smart-link  lyosint</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.38;0.39;1" dur="2.5s" fill="freeze"/>
  </g>
  <g>
    <text x="56" y="246" font-size="19"><tspan fill="#E2A93B">$</tspan><tspan fill="#F2EFE6" dx="10">cat focus.txt</tspan></text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.49;1" dur="2.5s" fill="freeze"/>
  </g>
  <g>
    <text x="56" y="284" font-size="19" fill="#C7CEDB">arabic-first products · education · commerce · automation · osint</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.58;0.59;1" dur="2.5s" fill="freeze"/>
  </g>
  <g>
    <text x="56" y="322" font-size="19"><tspan fill="#E2A93B">$</tspan><tspan fill="#F2EFE6" dx="10">uptime --build</tspan></text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.68;0.69;1" dur="2.5s" fill="freeze"/>
  </g>
  <g>
    <text x="56" y="360" font-size="19" fill="#C7CEDB">since 2025 · 20 public repos · every number on this page is live</text>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.78;0.79;1" dur="2.5s" fill="freeze"/>
  </g>
  <g>
    <text x="56" y="398" font-size="19" fill="#E2A93B">$</text>
    <rect x="72" y="381" width="11" height="21" fill="#E2A93B">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.88;0.89;1" dur="2.5s" fill="freeze"/>
  </g>

  <!-- شريط الحالة -->
  <line x1="2.25" y1="438" x2="1197.75" y2="438" stroke="#232A38" stroke-width="1.5"/>
  <text x="56" y="461" font-size="14" fill="#5C6577">zsh · utf-8 · arabic-ready</text>
  <circle cx="888" cy="456.5" r="4.5" fill="#E2A93B">
    <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="900" y="461" font-size="14" fill="#C7CEDB">live · synced with github api</text>
</svg>
